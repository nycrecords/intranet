{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block title %}Events{% endblock %}

{% block custom_css %}
        <link rel=stylesheet type=text/css href="{{ url_for('static', filename='css/calendar.css') }}"/>
{% endblock %}

{% block page_content %}
    <!-- Add your Custom image class below (after 'banner-with-background') -->
    <div class="bg-primary banner-with-background oculus d-flex flex-column">

        <div class="container-fluid my-auto text-center">
            <div class="narrow">
                <h1 class="display-4 text-white">Events</h1>
            </div>
        </div>
        <!-- .container -->
    </div>
    <!-- .banner-with-background -->
<div class="col-sm-12">
    <div class="breadcrumb-section">
        <nav class="breadcrumb-nav" aria-label="breadcrumb">
            <ol class="breadcrumb breadcrumb-ol">
                <li class="breadcrumb-item">
                    <a href="{{ url_for('main.index') }}">Home</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="{{ url_for('main.news_and_updates') }}">News & Updates</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">Events</li>
            </ol>
        </nav>
    </div>

    <div class="col-sm-7 events-table-column">
        <a class="btn btn-primary" href="{{ url_for('main.new_event_post') }}">Create New Event</a><br><br>
        <div>
            <div class="tab">
                <button class="active events-this-month">
                    Events This Month
                </button>
            </div>
        </div>
        <div id="event-rows" class="tabcontent container-fluid">
        </div>
    </div>

    <div class="col-sm-5 calendar-column">
        <div id="datepicker"></div>
    </div>
</div>
{% endblock %}

{% block custom_scripts %}
    <script type="text/javascript" src="{{ url_for('static', filename='js/calendar.js') }}"></script>
{% endblock %}
